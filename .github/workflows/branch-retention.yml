name: "chore(cleanup): Prune remote branches"

on:
  schedule:
    - cron: "15 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview branch deletions
        type: boolean
        default: true

concurrency:
  group: branch-retention
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prune:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prune remote branches
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          refs=$(git ls-remote --heads origin)
          deletions=()
          leases=()
          while IFS=$'\t' read -r sha ref; do
            [[ "$ref" == refs/heads/* && "$ref" != refs/heads/main ]] || continue
            echo "Branch to prune: ${ref#refs/heads/} ($sha)"
            deletions+=(":${ref}")
            leases+=("--force-with-lease=${ref}:${sha}")
          done <<< "$refs"

          if [[ "$DRY_RUN" == true || "${#deletions[@]}" -eq 0 ]]; then
            exit 0
          fi
          git push --atomic "${leases[@]}" origin "${deletions[@]}"
