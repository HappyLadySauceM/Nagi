name: build-images

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      # just verify 的口径由 Justfile 定义，与 api filter 保持一致。
      - "Justfile"
      - ".github/workflows/build-images.yml"
  # PR 也要跑 verify：分支保护把它作为合并门槛，具体跑哪些步骤由 changes 作业判定。
  # 镜像构建与推送仍然只在 main 的 push 与手动触发时执行。
  pull_request:
  workflow_dispatch:

# PR 上连续推送时取消旧运行；main 与手动触发不取消，避免打断发布流水线。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZOT: zot.infra-registry.svc.cluster.local:5000
  PROJECT: nagi
  CGO_ENABLED: "0"
  # 前端依赖走国内镜像，冷启动也快；不改仓库 .npmrc，避免影响本地开发。
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  # docker/build-push-action 默认每个矩阵任务上传一个 build record artifact，
  # 这里关掉：编译已在镜像多阶段内完成，本工作流不再上传任何 artifact。
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # 按镜像维度判定变更来源：只有对应代码变化时才重建该镜像，
  # 避免 web 改动顺带推一个没变的 api 镜像、让 Image Updater 白滚一次。
  changes:
    runs-on: hls-standard
    # paths-filter 卡住会把唯一的 builder 与后续作业一起堵死。
    timeout-minutes: 5
    permissions:
      contents: read
      # PR 事件下 paths-filter 走 GitHub API 取变更文件列表，需要读 pull request。
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      images: ${{ steps.matrix.outputs.images }}
    steps:
      # push 到主分支时 paths-filter 用 git diff 对比 push 前的提交，需要完整历史。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # workflow_dispatch 没有可比对的 base，跳过判定，由下一步按全量处理。
      # 只改本工作流时两个 filter 都不命中：不重建镜像，构建链路靠 workflow_dispatch 验证。
      - if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - "cmd/**"
              - "internal/**"
              - "pkg/**"
              - "go.mod"
              - "go.sum"
              - "Dockerfile"
              - ".dockerignore"
              # just verify 的口径由 Justfile 定义，改了它必须跑 Go 校验。
              - "Justfile"
            web:
              - "web/**"

      - name: 汇总待构建镜像
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo 'images=["api","web"]' >> "$GITHUB_OUTPUT"
          else
            echo "images=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    runs-on: hls-builder
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # 库名自带 _test：dbtest 会原样使用，而跨连接池用例会用该变量再开一个池，
      # 两个池必须指向同一个库，否则 TestClaimsSerializeConversationAcrossPools 会失败。
      NAGI_TEST_DSN: postgres://nagi:nagi-local@127.0.0.1:5432/nagi_test?sslmode=disable
    # 集成测试要求 PostgreSQL 17（pkg/db.Connect 的版本闸门）；runner 上直接用服务容器，
    # 端口映射到宿主机，步骤里的 127.0.0.1:5432 即可连上。
    # job 级 services 无法按路径条件化：只改 web 的 PR 也会拉起它（几秒容器启动），
    # 要彻底省掉只能把 Go 校验拆成独立作业，代价是多一个必需检查。
    services:
      postgres:
        # runner 的 dind 拉不到 Docker Hub（EOF），镜像统一走集群内 Zot，
        # infrastructure/postgres:17 由官方 postgres:17 同步而来。
        image: zot.infra-registry.svc.cluster.local:5000/infrastructure/postgres:17
        credentials:
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}
        env:
          POSTGRES_USER: nagi
          POSTGRES_PASSWORD: nagi-local
          POSTGRES_DB: nagi_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U nagi -d nagi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      # 生成的 ent 代码依赖 encoding/json/jsontext：该包在 1.26 仍需
      # GOEXPERIMENT=jsonv2，1.27 起才默认可用，所以显式装 1.27.x，
      # 不用 runner 预装的 /usr/local/go，也不跟随 go.mod 的 1.26.0。
      # 不缓存 go.mod 依赖与 pnpm store：编译已搬进镜像（依赖走 buildx 层缓存），
      # runner 上只剩校验要用的依赖，goproxy.cn / npmmirror 现拉足够快；
      # 而自托管 runner 上传缓存很慢（main 上 setup-go 约 2.5 min、pnpm store 约 3.5 min），
      # 缓存反而拖慢流水线。
      # 只在 Go 校验会执行时装工具链：web-only / 只改 workflow 的 PR 不再拉 Go。
      - uses: actions/setup-go@v6
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
        with:
          go-version: "1.27.x"
          cache: false

      # GOPROXY 用步骤级环境变量：go env -w 会写进自托管 runner 的全局配置，跨作业残留。
      - name: Go 校验
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
        env:
          GOPROXY: https://goproxy.cn,direct
        run: |
          set -euo pipefail
          just verify
          git diff --exit-code

      - name: 前端依赖与测试
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      # 编译本身在 build 作业的镜像内完成，`just verify` 的 go vet/test 已覆盖全部包，
      # 这里不再重复编译。
      # 只改文档或只改 workflow 时两个 filter 都不命中：不跑任何校验，但要显式说明，
      # 避免「全绿」被误读成校验过（该口径也写在 README 的构建小节）。
      # 用 == 'false' 而不是 != 'true'：filter 输出异常时宁可没有说明，也不要写成「确认无相关改动」。
      # workflow_dispatch 会强制全量校验，不需要这条说明。
      - name: 无相关改动
        if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.api == 'false' && needs.changes.outputs.web == 'false'
        run: |
          set -euo pipefail
          echo "本次运行（${GITHUB_EVENT_NAME}）没有改动 Go 或前端代码，verify 未执行实际校验（仅路径过滤后的空过）。" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Nagi-${{ matrix.name }}
    needs: [changes, verify]
    # 只跑变更过的镜像；images 为空时整体跳过（job 级 if 不认 matrix，故用动态矩阵）。
    # PR 只校验不构建：镜像构建、签名与推送只在 main 的 push 与手动触发时执行。
    if: github.event_name != 'pull_request' && needs.changes.outputs.images != '[]'
    runs-on: hls-builder
    # 自托管 runner 只有一个，卡死的构建会把后续发布一起堵住。
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      # tag 用 7 位提交前缀，与 Argo CD Image Updater 的 allowTags 正则一致。
      # BuildDate 取提交时间而不是当前时间：同一提交重复构建仍能命中编译缓存。
      - name: 计算镜像 tag
        run: |
          set -euo pipefail
          # 严格取 7 位：--short 在对象库有歧义时会自动加长，与 Image Updater 的 allowTags 口径不一致。
          short=$(git rev-parse HEAD | cut -c1-7)
          {
            echo "SHORT_SHA=$short"
            echo "IMAGE_VERSION=0.1.0-dev+$short"
            echo "COMMIT_DATE=$(git log -1 --format=%cI)"
          } >> "$GITHUB_ENV"

      # dind 拉不到 Docker Hub（EOF），buildkit 镜像必须用 Zot 里的那份；
      # 登录必须早于 setup-buildx，否则 buildx 创建 builder 时拉不到镜像。
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.ZOT }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ env.ZOT }}/infrastructure/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."${{ env.ZOT }}"]
              insecure = true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Nagi-${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.name == 'api' && '.' || 'web' }}
          file: ${{ matrix.name == 'api' && 'Dockerfile' || 'web/Dockerfile' }}
          push: true
          # 不生成 provenance 证明：没有消费方，而且关掉后推送的 digest 就是镜像 manifest 本身，
          # 签名与构建摘要都指向同一个对象，统计层大小也不用再解析多平台索引。
          provenance: false
          cache-from: type=gha,scope=nagi-${{ matrix.name }}
          # ignore-error：缓存导出失败（配额、网络）只降级缓存，不让发布失败。
          cache-to: type=gha,mode=max,scope=nagi-${{ matrix.name }},ignore-error=true
          # 版本注入只对 api 的 Dockerfile 生效；web 没声明这些 ARG，构建日志里会有一条
          # 「were not consumed」警告，不影响构建。
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            COMMIT=${{ env.SHORT_SHA }}
            BUILD_DATE=${{ env.COMMIT_DATE }}
          # labels 只写镜像 config，不新增层，不影响层缓存命中。
          labels: |
            org.opencontainers.image.title=Nagi-${{ matrix.name }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/happyladysaucem/${{ env.PROJECT }}-${{ matrix.name }}:${{ env.SHORT_SHA }}
            ${{ env.ZOT }}/${{ env.PROJECT }}/${{ matrix.name }}:${{ env.SHORT_SHA }}

      # -X 指向不存在的符号是静默 no-op：从刚推上去的镜像里断言版本真的注入成功，
      # 否则线上 /api/v1/status 会一直是 0.1.0-dev 而 CI 全绿。
      # 注意本步骤在 push 之后：断言失败时镜像已进 registry，需要人工回收该 tag（不能让 Image Updater 滚上去）。
      # 先 pull 再用本地这份跑：既保证校验的是刚推上去的产物，也把「拉不到」和「起不来」分开报错。
      - name: 校验版本注入
        if: matrix.name == 'api'
        run: |
          set -euo pipefail
          : "${SHORT_SHA:?}" "${IMAGE_VERSION:?}"
          ref="${{ env.ZOT }}/${{ env.PROJECT }}/api:${SHORT_SHA}"
          if ! docker pull "$ref"; then
            echo "::error::无法拉取 ${ref}：检查 runner 的 docker daemon 是否信任 Zot 与登录是否生效"
            exit 1
          fi
          if ! version=$(docker run --rm "$ref" -version 2>&1); then
            echo "::error::镜像 ${ref} 能拉取但跑不起来，检查运行阶段的 ENTRYPOINT 与架构；输出：${version}"
            exit 1
          fi
          echo "$version"
          grep -qF -- "nagi ${IMAGE_VERSION} (commit ${SHORT_SHA}" <<<"$version" || {
            echo "::error::期望 'nagi ${IMAGE_VERSION} (commit ${SHORT_SHA})'，实际：${version}；检查 Dockerfile 的 -X 符号路径。镜像已推送，需回收 ${ref}"
            exit 1
          }

      # 构建摘要直接进 run 页面：digest、压缩后大小、推送地址。纯观测，失败不影响发布。
      - name: 记录构建摘要
        continue-on-error: true
        env:
          REF: ${{ env.ZOT }}/${{ env.PROJECT }}/${{ matrix.name }}:${{ env.SHORT_SHA }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ZOT_USER: ${{ secrets.ZOT_USERNAME }}
          ZOT_PASS: ${{ secrets.ZOT_PASSWORD }}
        run: |
          set -euo pipefail
          repo="${REF%:*}"
          host="${repo%%/*}"
          path="${repo#*/}"
          accept="application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json"
          # provenance 已关掉：digest 就是镜像 manifest 本身，层大小可直接累加。
          # 观测步骤不能因为 registry 抖动整段消失：取不到就回落成「未知」。
          manifest=$(curl -fsSk -u "$ZOT_USER:$ZOT_PASS" -H "Accept: $accept" \
            "https://$host/v2/$path/manifests/${IMAGE_DIGEST}" || true)
          layers=$(echo "$manifest" | sed -n 's/.*"layers":\(\[[^]]*\]\).*/\1/p' || true)
          # awk 对空输入也输出 0，兜底用 || true：否则 grep 找不到 size 时会被 pipefail + set -e 直接中断，
          # 摘要整段消失；写成 || echo 0 又会拼出 "0\n0"。
          size=$(echo "$layers" | grep -o '"size":[0-9]*' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}' || true)
          # 极端情况下 $size 可能不是数字，先归一化，避免整数比较报错让摘要整段消失。
          case "$size" in ''|*[!0-9]*) size=0 ;; esac
          if [ "$size" -gt 0 ]; then size_text="$((size/1024/1024)) MiB"; else size_text="未知（取不到 layers）"; fi

          {
            echo "### ${PROJECT}-${{ matrix.name }} ${SHORT_SHA}"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| digest | \`${IMAGE_DIGEST}\` |"
            echo "| 压缩后大小 | ${size_text} |"
            echo "| Zot | \`${REF}\` |"
            echo "| ghcr | \`ghcr.io/happyladysaucem/${PROJECT}-${{ matrix.name }}:${SHORT_SHA}\` |"
            echo "| 缓存 scope | \`nagi-${{ matrix.name }}\`（命中明细看构建日志里的 CACHED） |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 缓存 cosign
        id: cosign-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/cosign
          key: ${{ runner.os }}-cosign-2.4.1

      - name: Install cosign
        if: steps.cosign-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/cosign" \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x "$HOME/.local/bin/cosign"

      - name: Sign image
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          ZOT_USER: ${{ secrets.ZOT_USERNAME }}
          ZOT_PASS: ${{ secrets.ZOT_PASSWORD }}
        run: |
          set -euo pipefail
          # 自托管 runner 是持久化的：私钥放临时目录，正常退出、失败、取消、超时都清掉。
          # SIGKILL 兜不住，但那已经超出脚本能处理的范围。
          umask 077
          keydir=$(mktemp -d)
          trap 'rc=$?; rm -rf -- "$keydir" || true; exit $rc' EXIT
          trap 'exit 130' INT TERM
          printf '%s' "$COSIGN_KEY" > "$keydir/cosign.key"
          "$HOME/.local/bin/cosign" sign --key "$keydir/cosign.key" --yes --tlog-upload=false \
            --allow-insecure-registry \
            --registry-username "$ZOT_USER" \
            --registry-password "$ZOT_PASS" \
            "${{ env.ZOT }}/${{ env.PROJECT }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
