name: build-images

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.event.workflow_run.head_branch || github.ref_name }}
  queue: max

permissions:
  contents: read

env:
  ZOT: zot.infra-registry.svc.cluster.local:5000
  CGO_ENABLED: "0"
  GOTOOLCHAIN: auto
  GOPROXY: https://goproxy.cn,direct
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  compile:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: hls-builder
    timeout-minutes: 30
    outputs:
      head_sha: ${{ steps.meta.outputs.head_sha }}
    container:
      image: &ubuntu zot.infra-registry.svc.cluster.local:5000/infrastructure/ubuntu:24.04@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec
      credentials: &zot-pull
        username: ${{ secrets.ZOT_USERNAME }}
        password: ${{ secrets.ZOT_PASSWORD }}
      options: --user 1001:1001
      volumes: &toolchain
        - /opt/arc-runner/nagi/toolchains/v1:/opt/nagi-tools:ro
        - /opt/arc-runner/nagi/toolchains/v1/etc/passwd:/etc/passwd:ro
        - /opt/arc-runner/nagi/toolchains/v1/etc/group:/etc/group:ro
      env: &tool-env
        PATH: /opt/nagi-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        SSL_CERT_FILE: /opt/nagi-tools/etc/ca-certificates.crt
        NODE_EXTRA_CA_CERTS: /opt/nagi-tools/etc/ca-certificates.crt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: 记录构建 commit
        id: meta
        run: echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 准备编译目录
        run: |
          cache="$RUNNER_TEMP/nagi-cache"
          mkdir -p "$cache"/{go/mod,go/build,pnpm/store,npm}
          {
            echo "GOMODCACHE=$cache/go/mod"
            echo "GOCACHE=$cache/go/build"
            echo "PNPM_STORE=$cache/pnpm/store"
            echo "NPM_CONFIG_CACHE=$cache/npm"
            echo "SHORT_SHA=$(git rev-parse HEAD | cut -c1-7)"
            echo "COMMIT_DATE=$(git log -1 --format=%cI)"
            echo "HEAD_SHA=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
      - name: 编译 API 产物
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p "$RUNNER_TEMP/nagi-api"
          pkg=github.com/HappyLadySauceM/Nagi/pkg/version
          go build -trimpath \
            -ldflags="-s -w -X $pkg.Version=0.1.0-dev+$SHORT_SHA -X $pkg.Commit=$SHORT_SHA -X $pkg.BuildDate=$COMMIT_DATE" \
            -o "$RUNNER_TEMP/nagi-api/nagi" ./cmd
      - name: 构建 Web 产物
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE"
          pnpm build
      - uses: actions/upload-artifact@v7
        name: 上传 API 产物
        with:
          name: nagi-api-${{ steps.meta.outputs.head_sha }}
          path: ${{ runner.temp }}/nagi-api/nagi
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        name: 上传 Web 产物
        with:
          name: nagi-web-${{ steps.meta.outputs.head_sha }}
          path: web/dist/
          if-no-files-found: error
          overwrite: true

  release:
    needs: compile
    if: always() && needs.compile.result == 'success'
    runs-on: hls-builder
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    container:
      image: *ubuntu
      credentials: *zot-pull
      options: --user 1001:1001 --group-add 123
      volumes: *toolchain
      env: *tool-env
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.compile.outputs.head_sha }}
      - name: 准备发布目录
        run: |
          config="$RUNNER_TEMP/nagi-docker"
          mkdir -p "$config/cli-plugins"
          ln -s /opt/nagi-tools/libexec/docker-buildx "$config/cli-plugins/docker-buildx"
          {
            echo "DOCKER_CONFIG=$config"
            echo "NAGI_ARTIFACTS=$RUNNER_TEMP"
            echo "SHORT_SHA=$(git rev-parse HEAD | cut -c1-7)"
            echo "HEAD_SHA=$(git rev-parse HEAD)"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        name: 下载 API 产物
        with:
          name: nagi-api-${{ needs.compile.outputs.head_sha }}
          path: ${{ runner.temp }}/nagi-api
      - uses: actions/download-artifact@v8
        name: 下载 Web 产物
        with:
          name: nagi-web-${{ needs.compile.outputs.head_sha }}
          path: ${{ runner.temp }}/nagi-web
      - name: 检查发布产物
        run: |
          test -s "$RUNNER_TEMP/nagi-api/nagi"
          chmod +x "$RUNNER_TEMP/nagi-api/nagi"
          test -s "$RUNNER_TEMP/nagi-web/index.html"
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.ZOT }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ env.ZOT }}/infrastructure/buildkit:buildx-stable-1@sha256:98cc6a3fc46220d00f8224ae483f3274fc874e9be8d7dd1e2e2c5481209228b5
          buildkitd-config-inline: |
            [registry."${{ env.ZOT }}"]
              insecure = true
      - name: 打包并推送 API 到 GHCR
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          target: package-only
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/happyladysaucem/nagi-api:${{ env.SHORT_SHA }}
          build-contexts: nagi_artifacts=${{ env.NAGI_ARTIFACTS }}/nagi-api
          cache-from: type=registry,ref=${{ env.ZOT }}/buildcache/nagi-api:package
          build-args: |
            VERSION=0.1.0-dev+${{ env.SHORT_SHA }}
            COMMIT=${{ env.SHORT_SHA }}
          labels: &labels |
            org.opencontainers.image.version=0.1.0-dev+${{ env.SHORT_SHA }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: 打包并推送 Web 到 GHCR
        id: web
        uses: docker/build-push-action@v7
        with:
          context: web
          target: package-only
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/happyladysaucem/nagi-web:${{ env.SHORT_SHA }}
          build-contexts: nagi_artifacts=${{ env.NAGI_ARTIFACTS }}/nagi-web
          cache-from: type=registry,ref=${{ env.ZOT }}/buildcache/nagi-web:package
          labels: *labels
      - name: 确认 GitHub Packages 新版本
        uses: actions/github-script@v9
        env: &digests
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        with:
          script: |
            for (const [component, digest] of Object.entries({
              api: process.env.API_DIGEST, web: process.env.WEB_DIGEST
            })) {
              if (!digest) continue;
              const params = {
                org: context.repo.owner, package_type: 'container',
                package_name: 'nagi-' + component
              };
              const { data: pkg } = await github.request(
                'GET /orgs/{org}/packages/{package_type}/{package_name}', params
              );
              if (pkg.visibility !== 'public' ||
                  pkg.repository?.full_name !== process.env.GITHUB_REPOSITORY) {
                throw new Error(params.package_name + ' must be public and linked to ' + process.env.GITHUB_REPOSITORY);
              }

              const route = 'GET /orgs/{org}/packages/{package_type}/{package_name}/versions';
              let version;
              for (let attempt = 0; attempt < 8; attempt++) {
                const versions = await github.paginate(route, { ...params, per_page: 100 });
                version = versions.find(item => item.name === digest &&
                  item.metadata?.container?.tags?.includes(process.env.SHORT_SHA));
                if (version) break;
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
              if (!version) throw new Error(params.package_name + ' version tag and digest were not indexed');
              await core.summary.addLink(params.package_name + ' ' + process.env.SHORT_SHA, version.html_url)
                .addEOL().write();
            }
      - name: 匿名核对 GHCR 摘要
        env: *digests
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'unlink "$DOCKER_CONFIG/config.json"; rmdir "$DOCKER_CONFIG"' EXIT
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"
          for component in api web; do
            digest_var="${component^^}_DIGEST"
            digest="${!digest_var}"
            [[ -n "$digest" ]] || continue
            test "$(crane digest "ghcr.io/happyladysaucem/nagi-$component:$SHORT_SHA")" = "$digest"
          done
      - name: 同步、签名并发布 Zot 镜像
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'unlink "$key"' EXIT
          printf '%s' "$COSIGN_KEY" > "$key"
          unset COSIGN_KEY
          for component in api web; do
            digest_var="${component^^}_DIGEST"
            digest="${!digest_var}"
            [[ -n "$digest" ]] || continue
            image="$ZOT/nagi/$component"
            crane copy "ghcr.io/happyladysaucem/nagi-$component@$digest" "$image:staging"
            test "$(crane digest "$image:staging")" = "$digest"
            cosign sign --key "$key" --yes --tlog-upload=false "$image@$digest"
          done

          for component in api web; do
            digest_var="${component^^}_DIGEST"
            digest="${!digest_var}"
            [[ -n "$digest" ]] || continue
            image="$ZOT/nagi/$component"
            crane tag "$image@$digest" "$SHORT_SHA"
            test "$(crane digest "$image:$SHORT_SHA")" = "$digest"
          done