name: build-images

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

env:
  ZOT: zot.infra-registry.svc.cluster.local:5000
  PROJECT: nagi
  CGO_ENABLED: "0"
  # 前端依赖走国内镜像，冷启动也快；不改仓库 .npmrc，避免影响本地开发。
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  # docker/build-push-action 默认每个矩阵任务上传一个 build record artifact，
  # 这里关掉，Artifacts 只保留工作流自己上传的 nagi-api / nagi-web。
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  verify:
    runs-on: hls-builder
    steps:
      - uses: actions/checkout@v7

      - name: 缓存 Go 模块
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-gomod-

      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Go 校验
        run: |
          set -euo pipefail
          go env -w GOPROXY=https://goproxy.cn,direct
          just verify
          git diff --exit-code

      - name: 前端依赖与测试
        working-directory: web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: 编译二进制
        run: |
          set -euo pipefail
          go build -trimpath -ldflags="-s -w" -o bin/nagi ./cmd

      - uses: actions/upload-artifact@v7
        with:
          name: nagi-api
          path: bin/nagi
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: nagi-web
          path: web/dist
          retention-days: 1

  build:
    name: Build Nagi-${{ matrix.name }}
    needs: verify
    runs-on: hls-builder
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # tag 用 7 位提交前缀，与 Argo CD Image Updater 的 allowTags 正则一致。
      - name: 计算镜像 tag
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: nagi-${{ matrix.name }}
          path: ${{ matrix.name == 'api' && 'bin' || 'web/dist' }}

      # dind 拉不到 Docker Hub（EOF），buildkit 镜像必须用 Zot 里的那份；
      # 登录必须早于 setup-buildx，否则 buildx 创建 builder 时拉不到镜像。
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.ZOT }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=zot.infra-registry.svc.cluster.local:5000/infrastructure/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."zot.infra-registry.svc.cluster.local:5000"]
              insecure = true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Nagi-${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=nagi-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=nagi-${{ matrix.name }}
          tags: |
            ghcr.io/happyladysaucem/${{ env.PROJECT }}-${{ matrix.name }}:${{ env.SHORT_SHA }}
            ${{ env.ZOT }}/${{ env.PROJECT }}/${{ matrix.name }}:${{ env.SHORT_SHA }}

      - name: 缓存 cosign
        id: cosign-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/cosign
          key: ${{ runner.os }}-cosign-2.4.1

      - name: Install cosign
        if: steps.cosign-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/cosign" \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x "$HOME/.local/bin/cosign"

      - name: Sign image
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$COSIGN_KEY" > /tmp/cosign.key
          chmod 600 /tmp/cosign.key
          "$HOME/.local/bin/cosign" sign --key /tmp/cosign.key --yes --tlog-upload=false \
            --allow-insecure-registry \
            --registry-username "${{ secrets.ZOT_USERNAME }}" \
            --registry-password "${{ secrets.ZOT_PASSWORD }}" \
            "${{ env.ZOT }}/${{ env.PROJECT }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
