name: build-images

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

env:
  ZOT: zot.infra-registry.svc.cluster.local:5000
  PROJECT: nagi
  CGO_ENABLED: "0"
  # docker/build-push-action 默认每个矩阵任务上传一个 build record artifact，
  # 这里关掉，Artifacts 只保留工作流自己上传的 nagi-api / nagi-web。
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  verify:
    runs-on: hls-builder
    steps:
      - uses: actions/checkout@v7

      - name: Go 校验
        run: |
          set -euo pipefail
          go env -w GOPROXY=https://goproxy.cn,direct
          just verify
          git diff --exit-code

      - name: 前端依赖与测试
        working-directory: web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: 编译二进制
        run: |
          set -euo pipefail
          go build -trimpath -ldflags="-s -w" -o bin/nagi ./cmd

      - uses: actions/upload-artifact@v7
        with:
          name: nagi-api
          path: bin/nagi

      - uses: actions/upload-artifact@v7
        with:
          name: nagi-web
          path: web/dist

  build:
    name: Build Nagi-${{ matrix.name }}
    needs: verify
    runs-on: hls-builder
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # tag 用 7 位提交前缀，与 Argo CD Image Updater 的 allowTags 正则一致。
      - name: 计算镜像 tag
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: nagi-${{ matrix.name }}
          path: ${{ matrix.name == 'api' && 'bin' || 'web/dist' }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."zot.infra-registry.svc.cluster.local:5000"]
              insecure = true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.ZOT }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push Nagi-${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=nagi-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=nagi-${{ matrix.name }}
          tags: |
            ghcr.io/happyladysaucem/${{ env.PROJECT }}-${{ matrix.name }}:${{ env.SHORT_SHA }}
            ${{ env.ZOT }}/${{ env.PROJECT }}/${{ matrix.name }}:${{ env.SHORT_SHA }}

      - name: Install cosign
        run: |
          curl -fsSL -o /tmp/cosign \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x /tmp/cosign

      - name: Sign image
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$COSIGN_KEY" > /tmp/cosign.key
          chmod 600 /tmp/cosign.key
          /tmp/cosign sign --key /tmp/cosign.key --yes --tlog-upload=false \
            --allow-insecure-registry \
            --registry-username "${{ secrets.ZOT_USERNAME }}" \
            --registry-password "${{ secrets.ZOT_PASSWORD }}" \
            "${{ env.ZOT }}/${{ env.PROJECT }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
