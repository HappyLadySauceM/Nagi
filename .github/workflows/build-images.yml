name: build-images

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      # just verify 的口径由 Justfile 定义，与 api filter 保持一致。
      - "Justfile"
      - ".github/workflows/build-images.yml"
  # PR 也要跑 verify：分支保护把它作为合并门槛，具体跑哪些步骤由 changes 作业判定。
  # 镜像构建与推送仍然只在 main 的 push 与手动触发时执行。
  pull_request:
  workflow_dispatch:

# PR 上连续推送时取消旧运行；main 与手动触发不取消，避免打断发布流水线。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZOT: zot.infra-registry.svc.cluster.local:5000
  CGO_ENABLED: "0"
  # 前端依赖走国内镜像，冷启动也快；不改仓库 .npmrc，避免影响本地开发。
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  # 按镜像维度判定变更来源：只有对应代码变化时才重建该镜像，
  # 避免 web 改动顺带推一个没变的 api 镜像、让 Image Updater 白滚一次。
  changes:
    runs-on: hls-standard
    # paths-filter 卡住会把唯一的 builder 与后续作业一起堵死。
    timeout-minutes: 5
    permissions:
      contents: read
      # PR 事件下 paths-filter 走 GitHub API 取变更文件列表，需要读 pull request。
      pull-requests: read
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      # push 到主分支时 paths-filter 用 git diff 对比 push 前的提交，需要完整历史。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # workflow_dispatch 没有可比对的 base，跳过判定，由下一步按全量处理。
      # 只改本工作流时两个 filter 都不命中：不重建镜像，构建链路靠 workflow_dispatch 验证。
      - if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - "cmd/**"
              - "internal/**"
              - "pkg/**"
              - "go.mod"
              - "go.sum"
              - "Dockerfile"
              - ".dockerignore"
              # just verify 的口径由 Justfile 定义，改了它必须跑 Go 校验。
              - "Justfile"
            web:
              - "web/**"

      - name: 汇总待构建镜像
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo 'images=["api","web"]' >> "$GITHUB_OUTPUT"
          else
            echo "images=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: always() && github.event_name == 'pull_request'
    runs-on: hls-builder
    timeout-minutes: 30
    permissions:
      contents: read
    env: &verify-env
      NAGI_TEST_DSN: postgres://nagi:nagi-local@postgres:5432/nagi_test?sslmode=disable
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn,direct
    container:
      image: &ubuntu zot.infra-registry.svc.cluster.local:5000/infrastructure/ubuntu:24.04@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec
      credentials: &zot-pull
        username: ${{ secrets.ZOT_USERNAME }}
        password: ${{ secrets.ZOT_PASSWORD }}
      options: --user 1001:1001
      volumes:
        - &toolchain /opt/arc-runner/nagi/toolchains/v1:/opt/nagi-tools:ro
        - &passwd /opt/arc-runner/nagi/toolchains/v1/etc/passwd:/etc/passwd:ro
        - &group /opt/arc-runner/nagi/toolchains/v1/etc/group:/etc/group:ro
        - /opt/arc-runner/nagi/cache/verify:/cache
      env: &tool-env
        PATH: /opt/nagi-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        SSL_CERT_FILE: /opt/nagi-tools/etc/ca-certificates.crt
        NODE_EXTRA_CA_CERTS: /opt/nagi-tools/etc/ca-certificates.crt
    defaults: &bash
      run:
        shell: bash
    services: &services
      postgres:
        image: zot.infra-registry.svc.cluster.local:5000/infrastructure/postgres:17
        credentials: *zot-pull
        env:
          POSTGRES_USER: nagi
          POSTGRES_PASSWORD: nagi-local
          POSTGRES_DB: nagi_test
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=512m
          --health-cmd "pg_isready -h 127.0.0.1 -U nagi -d nagi_test -t 3"
          --health-start-period 45s
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: 确认变更检测成功
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/nagi-verify
        with:
          api: 'true'
          web: 'true'
          cache: /cache

  release:
    needs: changes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.images != '[]'
    runs-on: hls-builder
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env: *verify-env
    container:
      image: *ubuntu
      credentials: *zot-pull
      options: --user 1001:1001 --group-add 123
      volumes: [*toolchain, *passwd, *group]
      env: *tool-env
    defaults: *bash
    services: *services
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 准备发布目录
        run: |
          release_dir=$(mktemp -d "$RUNNER_TEMP/nagi-release.XXXXXX")
          short=$(git rev-parse HEAD | cut -c1-7)
          {
            echo "RELEASE_DIR=$release_dir"
            echo "DOCKER_CONFIG=$release_dir/docker"
            echo "SHORT_SHA=$short"
            echo "IMAGE_VERSION=0.1.0-dev+$short"
            echo "COMMIT_DATE=$(git log -1 --format=%cI)"
          } >> "$GITHUB_ENV"
          mkdir -p "$release_dir/docker/cli-plugins"
          ln -s /opt/nagi-tools/libexec/docker-buildx "$release_dir/docker/cli-plugins/docker-buildx"

      - uses: ./.github/actions/nagi-verify
        with:
          api: ${{ contains(fromJSON(needs.changes.outputs.images), 'api') }}
          web: ${{ contains(fromJSON(needs.changes.outputs.images), 'web') }}
          cache: ${{ env.RELEASE_DIR }}/cache

      - name: 编译 API 发布产物
        if: contains(fromJSON(needs.changes.outputs.images), 'api')
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p "$RELEASE_DIR/api"
          version_pkg=github.com/HappyLadySauceM/Nagi/pkg/version
          go build -trimpath \
            -ldflags="-s -w -X ${version_pkg}.Version=$IMAGE_VERSION -X ${version_pkg}.Commit=$SHORT_SHA -X ${version_pkg}.BuildDate=$COMMIT_DATE" \
            -o "$RELEASE_DIR/api/nagi" ./cmd

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.ZOT }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ env.ZOT }}/infrastructure/buildkit:buildx-stable-1@sha256:98cc6a3fc46220d00f8224ae483f3274fc874e9be8d7dd1e2e2c5481209228b5
          buildkitd-config-inline: |
            [registry."${{ env.ZOT }}"]
              insecure = true

      - name: 打包、推送暂存镜像并签名
        env:
          IMAGES: ${{ join(fromJSON(needs.changes.outputs.images), ' ') }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash ci/package-images.sh stage

      - name: 发布正式镜像 tag
        env:
          IMAGES: ${{ join(fromJSON(needs.changes.outputs.images), ' ') }}
        run: bash ci/package-images.sh promote
