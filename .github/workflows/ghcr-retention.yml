name: "chore(cleanup): Update from GHCR cleanup automation"

on:
  workflow_dispatch:
    inputs:
      keep:
        description: 每个包至少保留的构建版本数
        default: "10"
      dry_run:
        description: 只预览，不删除
        type: boolean
        default: true
  schedule:
    - cron: "30 4 * * *"

concurrency:
  group: ghcr-retention
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: hls-maintenance
    timeout-minutes: 60
    steps:
      - name: 清理 GHCR 过期版本
        env:
          GH_TOKEN: ${{ github.token }}
          RETENTION_BACKEND: ghcr
          KEEP: ${{ inputs.keep || '10' }}
          MIN_AGE_DAYS: "7"
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || format('{0}', inputs.dry_run) }}
        run: python3 /opt/retention.py
