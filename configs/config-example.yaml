# QQBot 示例配置。复制为 configs/config.yaml 后填写真实值。
# 所有地址、凭据与密钥都直接写在本文件中；提交仓库的示例只含占位符，
# 真实值只写进已被 .gitignore 忽略的 configs/config.yaml。
# 优先级：默认值 → 本文件 → 通用运行时覆盖（QQBOT_SERVER_LISTEN / QQBOT_LOG_LEVEL / Flags）。

onebot:
  # 多账号接入：每个 QQ 账号在 SnowLuma 中对应一个独立的 OneBot 实例（不同端口）。
  # 启动后 QQBot 会对每个端点调用 get_login_info 自动识别 QQ 号；
  # expect-qq 可选，用于校验端点没有被配错，不一致时拒绝该连接。
  endpoints:
    - url: ws://127.0.0.1:3001
      access-token: "REPLACE_WITH_SNOWLUMA_TOKEN"
      expect-qq: 10001
    # - url: ws://127.0.0.1:3002
    #   access-token: "REPLACE_WITH_SNOWLUMA_TOKEN_B"
    #   expect-qq: 10002
  # 动作调用（发送消息等）的响应超时
  call-timeout: 10s
  # 心跳看门狗：窗口内没有任何入站帧即断开并重连；0 或负值关闭
  heartbeat-timeout: 60s
  reconnect:
    # 断线重连退避：从 initial 指数增长到 max，带随机抖动
    initial: 1s
    max: 30s

server:
  # 管理 HTTP API（/livez /readyz /api/v1/status）监听地址，默认仅监听本机
  listen: 127.0.0.1:5080
  enabled: true
  # 管理 API 的 Bearer Token；
  # 为空时不启用鉴权，仅适合默认的本机监听场景
  admin-token: ""

log:
  # debug | info | warn | error
  level: info

echo:
  # 内置示例上下文：ping 回 pong、"<prefix> <text>" 复读
  # 与 ai 同时开启时同一会话可能被 echo 和 AI 各回一次，启用 AI 前请先关闭本项
  enabled: true
  prefix: "/echo"

database:
  # PostgreSQL 连接字符串，直接填写。本地基础设施由仓库 docker-compose.yml 提供
  # （docker compose up -d），DSN 形如：
  #   postgres://qqbot:qqbot-local@127.0.0.1:5433/qqbot?sslmode=disable
  # 进程启动时自动应用 migrations/ 下的版本化迁移，无需手工执行。
  # 留空时数据库相关功能（目录/作用域/会话/记忆/观测）不启用。
  dsn: "postgres://qqbot:qqbot-local@127.0.0.1:5433/qqbot?sslmode=disable"
  # 连接池上限
  max-conns: 10

worker:
  # 决策任务工作器：跨会话全局并发上限
  concurrency: 4
  # 内存中待处理任务上限；超出部分保留在数据库
  max-pending-jobs: 1000
  # 任务轮询间隔
  poll-interval: 200ms

ai:
  # LLM 生成（OpenAI 兼容 chat/completions）。密钥直接填写；
  # enabled=true 时 api-key 必填，缺失会在启动阶段报错。
  enabled: false
  base-url: "https://YOUR_LLM_ENDPOINT/v1"
  api-key: "REPLACE_WITH_LLM_API_KEY"
  model: "your-chat-model"
  generation-timeout: 25s
  max-output-tokens: 400

agent:
  # ReAct 循环轮数上限（含工具调用轮次），超过即报错结束
  max-steps: 6
  # 单次运行的累计工具调用次数上限；用尽后模型收到提示并直接作答
  max-tool-calls: 5
  # 单次回复运行总时长上限（含模型与工具调用）
  max-run-duration: 30s

tools:
  # 启用的工具提供方 ID；为空时不向模型暴露任何工具。
  # 写错 ID 会导致启动失败，错误信息会列出已知提供方。
  # builtin.time: system.current_time；builtin.qq: qq.get_group_info（仅当前群）
  enabled: [builtin.time, builtin.qq]
  # 按权限标识覆盖默认基线；未列出的权限保持兜底规则（只读允许、其余拒绝）。
  # 作用域策略中的 tool_permissions 优先级更高。
  # 例：permission-defaults:
  #       qq.group.read: true
  permission-defaults: {}
  # 为 true 时才可能暴露非只读工具；默认 false，带副作用的工具始终不可见
  allow-side-effects: false
  # 单次工具调用超时
  timeout: 5s
  # 回给模型的结果字节上限，超出即拒绝
  max-result-bytes: 8192

intent:
  # 意图决策（TypeSafe Jev / SystemOne）。密钥直接填写，留空时降级为
  # 仅响应明确 @/引用，绝不自动插话。
  enabled: false
  provider: jev
  endpoint: "https://api.typesafe.ai/v1/systemone"
  api-key: ""
  model: "jev-latest"
  # 机器人昵称，用于 Jev state
  bot-name: ""
  timeout: 3s
  # 决策阈值：续聊 >= 0.80 且对他人 < 0.60 才续聊；插话 >= 0.95
  continuation-threshold: 0.80
  interjection-threshold: 0.95
  addressed-other-max: 0.60
  # 决策上下文读取的历史条数上限
  history-limit: 30

observability:
  # Langfuse OTLP 追踪导出，地址与项目凭据直接填写。
  # 本地自托管实例（docker compose up -d）的默认值如下，需与 Langfuse 项目页一致。
  # 自托管 Langfuse v4 保持 ingestion-version: "4"；其他版本留空。默认关闭；
  # 凭据缺失或导出故障均不影响聊天主链路。
  enabled: false
  base-url: "http://127.0.0.1:3010"
  public-key: "pk-lf-qqbot-local"
  secret-key: "sk-lf-qqbot-local"
  ingestion-version: "4"
  # 默认导出消息正文（prompt、回复与工具结果），使 Langfuse 详情页可直接阅读；
  # 设为 false 时 span 结构、耗时与用量照常导出，正文替换为 redacted 占位。
  export-raw-content: true
  # 标记部署环境（如 local/staging/prod），作为 deployment.environment 资源属性；
  # 留空时不写该属性
  environment: "local"
  # 生成发送者与账号假名的 HMAC 密钥，trace 中不会出现原始 QQ 号。
  # 必须自行生成且不得提交：openssl rand -hex 32（至少 32 字符，否则被视为不可用）。
  # 留空或使用示例占位符时不导出用户维度；生产环境用
  # QQBOT_OBSERVABILITY_USER_ID_SECRET 覆盖，换密钥后历史用户视图会与新的统计断开。
  user-id-secret: ""
  # 为 true 时改为直接导出原始 QQ 号（发送者、机器人账号、群号/私聊对象），
  # 便于对照真实用户排查与调参；此模式不需要 user-id-secret。
  # 注意：Langfuse 的 Users 视图会按真实 QQ 号聚合，同一用户在不同机器人账号下会被合并。
  # 可用 QQBOT_OBSERVABILITY_RAW_IDENTIFIERS 覆盖。
  raw-identifiers: false
