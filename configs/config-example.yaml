# QQBot 示例配置。复制为 configs/config.yaml 后按需修改。
# 优先级：默认值 → 本文件 → 环境变量（QQBOT_*）→ 命令行 Flags。

onebot:
  # SnowLuma OneBot v11 正向 WebSocket 服务地址（在 SnowLuma WebUI 的网络配置中查看）
  url: ws://127.0.0.1:3001
  # 与 SnowLuma 的 access token 保持一致；留空表示不启用鉴权
  access-token: ""
  # 动作调用（发送消息等）的响应超时
  call-timeout: 10s
  reconnect:
    # 断线重连退避：从 initial 指数增长到 max，带随机抖动
    initial: 1s
    max: 30s

server:
  # 管理 HTTP API（/livez /readyz /api/v1/status）监听地址，默认仅监听本机
  listen: 127.0.0.1:5080
  enabled: true

log:
  # debug | info | warn | error
  level: info

echo:
  # 内置示例上下文：ping 回 pong、"<prefix> <text>" 复读
  enabled: true
  prefix: "/echo"
