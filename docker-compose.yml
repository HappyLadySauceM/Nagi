# 本地集成测试与开发基础设施：PostgreSQL 18.6 + Redis + MinIO。
# 业务库默认 nagi_v2（端口 5434）；db-init 幂等创建集成测试库 nagi_test。
# Local stack for integration tests and dev: Postgres 18.6, Redis, MinIO on loopback where noted.

services:
  postgres:
    image: postgres:18.6
    container_name: nagi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nagi
      POSTGRES_PASSWORD: nagi-local
      POSTGRES_DB: nagi_v2
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - nagi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nagi -d nagi_v2"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: postgres:18.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: nagi-local
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h postgres -U nagi -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='nagi_test'" | grep -q 1 \
          || createdb -h postgres -U nagi nagi_test
    restart: "no"

  redis:
    image: redis:7
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_PASSWORD:-nagi-local-redis}
      --maxmemory-policy noeviction
    volumes:
      - nagi-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a nagi-local-redis ping | grep -q PONG"]
      interval: 3s
      timeout: 10s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/minio && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${NAGI_MEDIA_CORS_ORIGIN:-http://127.0.0.1:5173}
    volumes:
      - nagi-minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  minio-init:
    image: cgr.dev/chainguard/minio
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
      NAGI_MEDIA_ACCESS_KEY: ${NAGI_MEDIA_ACCESS_KEY:-nagi-audit-writer}
      NAGI_MEDIA_SECRET_KEY: ${NAGI_MEDIA_SECRET_KEY:-nagi-audit-local-secret}
    entrypoint:
      - sh
      - -ec
      - |
        export NO_PROXY="minio,localhost,127.0.0.1" no_proxy="minio,localhost,127.0.0.1"
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/nagi-audit
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::nagi-audit/nagi/*"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::nagi-audit"],"Condition":{"StringLike":{"s3:prefix":["nagi/*"]}}}]}' >/tmp/nagi-audit-write.json
        mc admin policy create local nagi-audit-write /tmp/nagi-audit-write.json || true
        mc admin user add local "$${NAGI_MEDIA_ACCESS_KEY}" "$${NAGI_MEDIA_SECRET_KEY}" || true
        mc admin policy attach local nagi-audit-write --user "$${NAGI_MEDIA_ACCESS_KEY}"
    command: []
    restart: "no"

volumes:
  nagi-pgdata:
  nagi-redis-data:
  nagi-minio-data: